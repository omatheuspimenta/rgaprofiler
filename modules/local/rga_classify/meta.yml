# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: rga_classify
description: Classify proteins into Resistance Gene Analog (RGA) families/subclasses from six tools' annotation outputs
keywords:
  - resistance gene analog
  - plant immunity
  - NLR
  - classification
tools:
  - rga_classify:
      description: |
        Harmonises InterProScan, Phobius, DeepTMHMM, SignalP 6.0, DeepLoc 2.0 and DeepCoil2
        outputs into a controlled vocabulary of nine immune-relevant features (NB-ARC, TIR,
        RPW8, CC, LRR, STTK, LysM, TM, SP) and applies an ordered, provably mutually-exclusive
        set of classification rules (a reimplementation of Rody et al. 2019, with three
        documented extensions) to call each protein's RGA family/subclass with a
        human-readable justification.
      homepage: https://github.com/omatheuspimenta/rgapredictor
      documentation: https://github.com/omatheuspimenta/rgapredictor/tree/main/docs/rga
      doi: ""
      licence: []
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - interproscan_tsv:
        type: file
        description: InterProScan TSV output (required upstream input)
    - phobius_tsv:
        type: file
        description: Phobius short-format output
    - deeptmhmm_gff3:
        type: file
        description: DeepTMHMM TMRs.gff3-format output
    - signalp_txt:
        type: file
        description: SignalP 6.0 prediction_results.txt-format output
    - deeploc_csv:
        type: file
        description: DeepLoc 2.0 results CSV
    - deepcoil_dir:
        type: directory
        description: Directory of DeepCoil2 per-protein .out files (modules/local/deepcoil2's `results_dir` output)
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - rga_out/*:
          type: file
          description: |
            rga_predictions.tsv, rga_predictions_by_locus.tsv, rga_domain_evidence_long.tsv,
            rga_summary_counts.tsv, unmatched_ids_report.tsv, accession_audit.tsv,
            cc_segment_sensitivity.tsv, cc_policy_sensitivity.tsv, report.html, report.md,
            run_metadata.json, logs/, cache/ -- see docs/rga/README.md §7 (vendored at
            docker/rga_classify/src/) for the full data dictionary.
          pattern: "rga_out/*"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@omatheuspimenta"
maintainers:
  - "@omatheuspimenta"
